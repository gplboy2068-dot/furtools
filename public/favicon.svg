<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>

    <!-- Main Accent Gradient -->
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Subtle Border Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Paw Group -->
  <g transform="translate(0, 10)">
    <!-- Main Center Pad -->
    <path d="M 256 250 C 195 250 155 295 155 345 C 155 390 198 420 256 420 C 314 420 357 390 357 345 C 357 295 317 250 256 250 Z" fill="url(#pawGrad)"/>
    
    <!-- Toe Pads -->
    <ellipse cx="160" cy="210" rx="34" ry="42" transform="rotate(-20 160 210)" fill="url(#pawGrad)"/>
    <ellipse cx="222" cy="155" rx="35" ry="45" transform="rotate(-7 222 155)" fill="url(#pawGrad)"/>
    <ellipse cx="290" cy="155" rx="35" ry="45" transform="rotate(7 290 155)" fill="url(#pawGrad)"/>
    <ellipse cx="352" cy="210" rx="34" ry="42" transform="rotate(20 352 210)" fill="url(#pawGrad)"/>
  </g>
</svg>
