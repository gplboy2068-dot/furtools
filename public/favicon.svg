<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0f0e0c"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e40"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#332e29" stroke-width="8"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="url(#pawGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Main Paw Pad -->
  <path d="M256 240 C 200 240, 160 280, 160 330 C 160 380, 205 410, 256 410 C 307 410, 352 380, 352 330 C 352 280, 312 240, 256 240 Z" fill="url(#pawGrad)"/>
  
  <!-- Toe Pads -->
  <circle cx="165" cy="205" r="34" fill="url(#pawGrad)"/>
  <circle cx="225" cy="155" r="36" fill="url(#pawGrad)"/>
  <circle cx="287" cy="155" r="36" fill="url(#pawGrad)"/>
  <circle cx="347" cy="205" r="34" fill="url(#pawGrad)"/>
</svg>
